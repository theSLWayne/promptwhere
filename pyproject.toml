[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "promptwhere"
version = "0.1.0"
description = "A basic, easy-to-use library for managing named, versioned prompts."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hiran Hasanka" }]
keywords = ["prompts", "prompt-management", "versioning", "llm", "yaml"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.urls]
Homepage = "https://github.com/theSLWayne/promptwhere"
Source = "https://github.com/theSLWayne/promptwhere"
Issues = "https://github.com/theSLWayne/promptwhere/issues"

[project.optional-dependencies]
jinja = ["Jinja2>=3"]
dev = ["pytest", "ruff", "mypy", "types-PyYAML"]

[project.scripts]
prompts = "promptwhere.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
promptwhere = ["py.typed"]
"promptwhere.ui" = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
strict = true
